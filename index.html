<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공간리한 — LEEHAN</title>
  <meta name="description" content="복합문화공간 리한 — 작은 것의 위대한 힘. 서울 서대문구 통일로 333.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="공간리한 LEEHAN">
  <meta property="og:title" content="공간리한 — LEEHAN">
  <meta property="og:description" content="복합문화공간 리한 — 작은 것의 위대한 힘. 서울 서대문구 통일로 333.">
  <meta property="og:url" content="https://spaceleehan.kr/">
  <meta property="og:image" content="https://spaceleehan.kr/공간 사진.jpeg">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="apple-touch-icon" href="Logo.png">
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <!-- Header -->
  <header>
    <div class="nav-side left">
      <a href="#exhibitions" class="active">전시</a>
      <a href="about.html">소개</a>
      <a href="rental.html">대관</a>
    </div>

    <a href="index.html" class="logo">
      <img src="공간리한_국문_sg2.png" alt="공간리한">
    </a>

    <div class="nav-side right">
      <a href="#info">방문</a>
      <a href="https://instagram.com/spaceleehan" target="_blank" rel="noopener" class="nav-ig">@spaceleehan</a>
    </div>

    <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="메뉴">
      <span></span><span></span><span></span>
    </button>

    <nav>
      <a href="#exhibitions" class="active">전시</a>
      <a href="about.html">소개</a>
      <a href="rental.html">대관</a>
      <a href="#info">방문</a>
    </nav>
  </header>

  <!-- Hero -->
  <div id="home">
    <!-- Kinetic marquee -->
    <div class="hero-band" aria-hidden="true">
      <div class="hero-band-track" id="marquee-track"></div>
    </div>

    <a class="hero" id="hero-mount"></a>
  </div>

  <!-- Exhibitions -->
  <section class="exhibitions" id="exhibitions">

    <!-- Featured Upcoming -->
    <div id="upcoming-block">
      <div class="block-head" data-reveal>
        <span class="num">02</span>
        <span class="label">Upcoming Exhibition</span>
        <span class="rule"></span>
      </div>
      <a class="exhibition-current" id="upcoming-mount" data-reveal></a>
    </div>

    <div class="section-divider"></div>

    <!-- Full Schedule — Horizontal Scroll -->
    <div class="block-head" data-reveal>
      <span class="num">03</span>
      <span class="label">Schedule</span>
      <span class="rule"></span>
    </div>
    <div class="past-scroll-wrapper" data-reveal>
      <div class="past-scroll" id="schedule-mount"></div>
    </div>
  </section>

  <!-- About -->
  <section id="about">
    <div class="about">
      <div class="about-text" id="about-text-mount" data-reveal></div>
      <div class="about-image" id="about-image-mount" data-reveal></div>
    </div>
  </section>

  <!-- Info -->
  <footer class="info" id="info"></footer>

  <!-- Floating rental toggle -->
  <a href="rental.html" class="rental-fab" aria-label="대관 안내 페이지로 이동">
    <span class="rf-eyebrow">Rental</span>
    <span class="rf-title">대관<span class="rf-arrow" aria-hidden="true">↗</span></span>
  </a>

  <script type="module" src="assets/js/render-home.js"></script>

</body>
</html>
