<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공간리한 소개 — LEEHAN</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="apple-touch-icon" href="Logo.png">
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <!-- Header -->
  <header>
    <div class="nav-side left">
      <a href="index.html#schedule">전시</a>
      <a href="about.html" class="active">소개</a>
      <a href="rental.html">대관</a>
    </div>

    <a href="index.html" class="logo">
      <img src="공간리한_국문_sg2.png" alt="공간리한">
    </a>

    <div class="nav-side right">
      <a href="index.html#info">방문</a>
      <a href="https://instagram.com/spaceleehan" target="_blank" rel="noopener" class="nav-ig">@spaceleehan</a>
    </div>

    <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="메뉴">
      <span></span><span></span><span></span>
    </button>

    <nav>
      <a href="index.html#schedule">전시</a>
      <a href="about.html" class="active">소개</a>
      <a href="rental.html">대관</a>
      <a href="index.html#info">방문</a>
    </nav>
  </header>

  <!-- About Page -->
  <main class="about-page">
    <a href="index.html" class="back-link">← 돌아가기</a>

    <!-- 공간과 설비 — 섹션별 캐러셀 -->
    <section class="facility" aria-label="공간과 설비">
      <div class="facility-inner">
        <div class="section-marker">
          <span class="section-marker-en">Facility</span>
          <h2 class="section-marker-ko">공간과 설비</h2>
        </div>
        <div id="fac-groups"></div>
      </div>
    </section>

    <!-- 스토리로 -->
    <div class="about-cta about-cta-story">
      <a href="story.html" class="about-cta-link">우리의 이야기 더 보기 →</a>
    </div>

  </main>

  <!-- Info -->
  <footer class="info" id="site-footer"></footer>

  <!-- Floating rental toggle -->
  <a href="rental.html" class="rental-fab" aria-label="대관 안내 페이지로 이동">
    <span class="rf-text">
      <span class="rf-eyebrow">Rental</span>
      <span class="rf-title">대관 안내</span>
    </span>
    <span class="rf-arrow" aria-hidden="true">↗</span>
  </a>

  <script type="module">
    import { loadData } from './assets/js/data.js';
    import { el, renderSiteFooter } from './assets/js/render.js';
    import { initUI } from './assets/js/ui.js';
    initUI();
    loadData()
      .then((d) => renderSiteFooter(document.getElementById('site-footer'), d.settings.visit))
      .catch((e) => console.error(e));

    // ── 공간과 설비 — 섹션별 캐러셀 ──
    const BASE = 'uploads/2026/space/facility/';
    const S1_DESC = '상상력을 구현하는 공간 — 자유로운 연출과 벽면 타공이 가능합니다. (※ 원상복구를 기본으로 합니다)';
    const GROUPS = [
      {
        num: '01', ko: '창과 입구', en: 'View & Entrance',
        slides: [
          { src: `${BASE}s2-window.jpg`, title: '넓은 통창 프레임',
            desc: '창 너머로 흘러가는 도시의 풍경이 마치 영화의 한 장면처럼 머무는 공간',
            alt: '통일로를 향해 난 넓은 통창' },
          { src: `${BASE}s2-facade.jpg`, title: '정돈된 첫인상, 세련된 파사드',
            desc: '관람객을 맞이하는 차분하고 감각적인 입구 디자인',
            alt: '공간리한 건물 외관 파사드와 입구' },
        ],
      },
      {
        num: '02', ko: '벽과 바닥', en: 'Wall & Floor',
        slides: ['01', '02', '03', '04', '05', '06', '07', '08', '09'].map((n) => ({
          src: `${BASE}s1-${n}.jpg`,
          title: '화이트월 & 에나멜 폴리싱 콘크리트 바닥', desc: S1_DESC,
          alt: '화이트월과 에나멜 폴리싱 콘크리트 바닥이 깔린 공간리한 전시장',
        })),
      },
      {
        num: '03', ko: '설비와 편의', en: 'Facilities',
        slides: [
          { src: `${BASE}s3-rail.jpg`, title: '가변형 고급 레일 조명',
            desc: '작품의 특성에 맞춰 섬세하게 연출 가능한 주백색 조명 (확산형·집중형 선택 가능)',
            alt: '천장 레일에 설치된 가변형 주백색 조명' },
          { src: `${BASE}s3-storage.jpg`, title: '다목적 수납 창고',
            desc: '상주 인원의 편의와 전시 기자재의 깔끔한 보관을 위한 전용 공간',
            alt: '전시 기자재를 보관하는 다목적 수납 창고' },
          { src: `${BASE}s3-sink.jpg`, title: '간이 수전 시설',
            desc: '오프닝 리셉션 및 다과 행사 시 유용하게 쓰이는 창고 내부 수전 설계',
            alt: '창고 내부에 설치된 간이 수전 시설' },
          { src: `${BASE}s3-wall.jpg`, title: '화이트 가벽',
            desc: '작품 전시 및 공간 분리로 자유롭게 활용 가능한 이동형 가벽',
            alt: '자유롭게 이동 가능한 화이트 가벽' },
        ],
      },
    ];

    const easeOutCubic = (t) => 1 - ((1 - t) ** 3);
    const groupsMount = document.getElementById('fac-groups');
    if (groupsMount) {
      const makeSlide = (f) => el('figure', { class: 'fac-slide' },
        el('img', { src: f.src, alt: f.alt, loading: 'lazy' }),
        el('div', { class: 'fac-scrim', 'aria-hidden': 'true' }),
        el('figcaption', { class: 'fac-cap' },
          el('span', { class: 'fac-title' }, f.title),
          el('span', { class: 'fac-desc' }, f.desc),
        ),
      );
      const groupHead = (g) => el('div', { class: 'fac-group-head' },
        el('span', { class: 'fac-group-num' }, g.num),
        el('div', { class: 'fac-group-title' },
          el('span', { class: 'fgt-ko' }, g.ko),
          el('span', { class: 'fgt-en' }, g.en),
        ),
      );

      GROUPS.forEach((g) => {
        const n = g.slides.length;

        // 사진이 적으면(2장 이하) 순환 대신 나란히 정적 배치 — 항상 밝게, 문구 표시
        if (n < 3) {
          const slideEls = g.slides.map((f) => { const s = makeSlide(f); s.classList.add('is-active'); return s; });
          groupsMount.append(
            el('div', { class: 'fac-group' }, groupHead(g), el('div', { class: 'fac-duo' }, ...slideEls)),
          );
          return;
        }

        // 3장 이상 — 무한 순환 캐러셀. 앞뒤로 복제본을 덧댄다: [...clones, real..., clones...]
        const CLONE = Math.min(2, n);
        const order = [];
        for (let k = n - CLONE; k < n; k += 1) order.push({ i: k, real: false });
        for (let k = 0; k < n; k += 1) order.push({ i: k, real: true });
        for (let k = 0; k < CLONE; k += 1) order.push({ i: k, real: false });
        const slideEls = order.map((o) => {
          const elm = makeSlide(g.slides[o.i]);
          elm.dataset.i = String(o.i);
          return elm;
        });
        const track = el('div', { class: 'fac-track' }, ...slideEls);
        const viewport = el('div', { class: 'fac-viewport' }, track);

        const prev = el('button', { class: 'fac-nav prev', type: 'button', 'aria-label': '이전 사진' }, '‹');
        const next = el('button', { class: 'fac-nav next', type: 'button', 'aria-label': '다음 사진' }, '›');

        // 슬라이드를 뷰포트 중앙에 두는 트랙 오프셋 픽셀
        const centerOffsetFor = (elm) => -(elm.offsetLeft + elm.offsetWidth / 2 - viewport.clientWidth / 2);
        const setTransform = (px, animate) => {
          track.style.transition = animate ? 'transform 0.5s var(--ease)' : 'none';
          track.style.transform = `translateX(${px}px)`;
        };
        // 논리 인덱스 cur을 [0, n) 범위로 표시하되, 트랙은 확장 인덱스로 이동
        const render = (extIdx, animate) => {
          const target = slideEls[extIdx];
          setTransform(centerOffsetFor(target), animate);
          slideEls.forEach((s, idx) => s.classList.toggle('is-active', idx === extIdx));
        };
        let extIdx = CLONE; // 첫 실제 슬라이드
        const go = (dir) => {
          extIdx += dir;
          render(extIdx, true);
          // 복제본에 도달하면 애니메이션 후 실제 위치로 순간이동(무한 순환)
          const onEnd = () => {
            track.removeEventListener('transitionend', onEnd);
            if (extIdx < CLONE) { extIdx += n; render(extIdx, false); }
            else if (extIdx >= CLONE + n) { extIdx -= n; render(extIdx, false); }
          };
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { onEnd(); }
          else { track.addEventListener('transitionend', onEnd); }
        };
        prev.addEventListener('click', () => go(-1));
        next.addEventListener('click', () => go(1));

        groupsMount.append(
          el('div', { class: 'fac-group' }, groupHead(g),
            el('div', { class: 'fac-stage' }, prev, viewport, next),
          ),
        );
        // 초기 렌더(동기) + 이미지 로드/리사이즈 후 재보정 (폭이 원본 비율이라 로드 전엔 0)
        const settle = () => render(extIdx, false);
        settle();
        requestAnimationFrame(settle);
        slideEls.forEach((s) => {
          const img = s.querySelector('img');
          if (!img.complete) img.addEventListener('load', settle, { once: true });
        });
        window.addEventListener('resize', settle);
      });
    }
  </script>

</body>
</html>
