<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 비공개 단계: 메뉴에 링크하지 않고 검색에도 안 잡히게 둔다. 공개하기로 하면 이 줄을 지우고 rental.html 에서 링크한다 -->
  <meta name="robots" content="noindex, nofollow">
  <title>대관 일정 — 공간리한</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="apple-touch-icon" href="Logo.png">
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <!-- Header -->
  <header>
    <div class="nav-side left">
      <a href="index.html#schedule">전시</a>
      <a href="about.html">소개</a>
      <a href="rental.html" class="active">대관</a>
    </div>

    <a href="index.html" class="logo">
      <img src="공간리한_국문_sg2.png" alt="공간리한">
    </a>

    <div class="nav-side right">
      <a href="index.html#info">방문</a>
      <a href="https://instagram.com/spaceleehan" target="_blank" rel="noopener" class="nav-ig">@spaceleehan</a>
    </div>

    <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="메뉴">
      <span></span><span></span><span></span>
    </button>

    <nav>
      <a href="index.html#schedule">전시</a>
      <a href="about.html">소개</a>
      <a href="rental.html" class="active">대관</a>
      <a href="index.html#info">방문</a>
    </nav>
  </header>

  <main class="about-page rental-page">
    <a href="rental.html" class="back-link">← 대관 안내</a>

    <div class="about-page-intro">
      <div class="about-eyebrow">Schedule · 대관 일정</div>
      <h1>대관 일정</h1>
      <p class="rental-lead">
        빈 날짜는 문의해 주세요.
      </p>
    </div>

    <section class="rental-calendar-wrap" id="rental-calendar" aria-label="대관 일정 달력"></section>

  </main>

  <footer class="info" id="site-footer"></footer>

  <script type="module">
    import { loadData } from './assets/js/data.js';
    import { renderSiteFooter } from './assets/js/render.js';
    import { initUI } from './assets/js/ui.js';
    import { mountRentalCalendar } from './assets/js/render-calendar.js';

    initUI();
    loadData()
      .then((d) => {
        mountRentalCalendar(document.getElementById('rental-calendar'), { getRentals: () => d.rentals });
        renderSiteFooter(document.getElementById('site-footer'), d.settings.visit);
      })
      .catch((e) => console.error(e));
  </script>

</body>
</html>
